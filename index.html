<div id="analysisReport" style="margin-top: 30px; padding: 20px; background: #fff; border-left: 6px solid #2c3e50; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none;">
    <h3 style="margin-top: 0; color: #2c3e50;">📊 大樹經濟學家深度分析報告</h3>
    <div id="reportContent" style="line-height: 1.8; font-size: 15px; color: #333;"></div>

<script>
let chart;

function predictNextPrice(){
    // --- 1. 處理經濟數據 (讀取 11 欄格式) ---
    let text = document.getElementById("inputData").value.trim();
    let lines = text.split("\n").filter(l => l.includes("-")); 
    
    // ⚠️ 修復：確保至少有兩筆資料才能計算前期比較
    if(lines.length < 2){ 
        alert("請至少貼入「兩筆」經濟歷史資料，才能計算變動率！"); 
        return; 
    }

    let dates=[], prices=[], gdps=[];
    for(let i=0;i<lines.length;i++){
        let cols = lines[i].split("\t");
        if(cols.length < 10){ alert("經濟資料格式錯誤，請確認包含11欄！"); return; }
        dates.push(cols[0]);
        gdps.push(parseFloat(cols[5]));       // 第6欄：名目GDP
        prices.push(parseFloat(cols[9]));     // 第10欄：股票結算價 (索引9)
    }

    // --- 2. 處理買賣數據 (籌碼面) ---
    let tradeText = document.getElementById("tradeData").value.trim();
    let tradeLines = tradeText.split("\n").filter(line => line.trim() !== "");
    let calcDays = parseInt(document.getElementById("calcDays").value) || 5;
    
    let totalLots = 0;   // 所有歷史累積張數 (算出總股數用)
    let totalBuys = 0;   // 近 N 期買
    let totalSells = 0;  // 近 N 期賣
    
    if(tradeLines.length > 0) {
        let uniqueDates = [];
        for(let i=0; i<tradeLines.length; i++){
            let cols = tradeLines[i].split("\t");
            if(cols.length >= 9){
                let dateStr = cols[1]; 
                if(!uniqueDates.includes(dateStr)) uniqueDates.push(dateStr);
                totalLots += (parseInt(cols[7]) || 0) - (parseInt(cols[8]) || 0); 
            }
        }
        
        let recentDates = uniqueDates.slice(-calcDays);

        for(let i=0; i<tradeLines.length; i++){
            let cols = tradeLines[i].split("\t");
            if(cols.length >= 9){
                let dateStr = cols[1];
                if(recentDates.includes(dateStr)){
                    totalBuys += parseInt(cols[7]) || 0;
                    totalSells += parseInt(cols[8]) || 0;
                }
            }
        }
    }
    
    let netBuy = totalBuys - totalSells; 
    let momentumFactor = netBuy * 0.005; 

    // 更新頂部 Data Hub 面板
    let totalShares = totalLots * 10;
    let latestGdp = gdps[gdps.length - 1];
    document.getElementById("dataHub").style.display = "flex";
    document.getElementById("resShares").innerText = totalShares + " 股";
    document.getElementById("resNetBuy").innerText = netBuy + " 張";
    document.getElementById("resGdp").innerText = latestGdp;

    // --- 3. 計算預測基準 (完美升級版邏輯 + 估值地心引力) ---
    // 🛠️ 修復：定義 lastLine 和 prevLine
    let lastLine = lines[lines.length - 1].split("\t");
    let prevLine = lines[lines.length - 2].split("\t");

    // 🛠️ 修復：計算歷史慣性 (avgChange)，此處取最近一期的漲跌幅作為慣性基準
    let prevPrice = parseFloat(lastLine[9]);       
    let olderPrice = parseFloat(prevLine[9]);
    let avgChange = olderPrice > 0 ? ((prevPrice - olderPrice) / olderPrice) * 0.5 : 0;

    let inflation = parseFloat(lastLine[1]);       
    let wage = parseFloat(lastLine[2]);            
    let cpi = parseFloat(lastLine[3]);             
    let money = parseFloat(lastLine[4]);           
    let prevMoney = parseFloat(prevLine[4]); 
    let prevCpi = parseFloat(prevLine[3]);     
    let latestNominalGdp = parseFloat(lastLine[5]); 
    let realGdpGrowth = parseFloat(lastLine[8]);   
    let gini = parseFloat(lastLine[10]);           

    // 🍎 估值地心引力 (巴菲特指標)
    let marketCap = totalShares * prevPrice; 
    let valuationRatio = (latestNominalGdp > 0) ? (marketCap / latestNominalGdp) : 1.5; 
    let factorGravity = 0;
    let gravityStatus = "估值合理";

    if (valuationRatio >= 2.5) {
        factorGravity = -0.05; 
        gravityStatus = "🔴 嚴重高估 (泡沫警告)";
    } else if (valuationRatio >= 1.8) {
        factorGravity = -0.02; 
        gravityStatus = "🟡 估值偏高 (存在壓力)";
    } else if (valuationRatio <= 0.8) {
        factorGravity = 0.05;  
        gravityStatus = "🟢 嚴重低估 (絕佳買點)";
    } else if (valuationRatio <= 1.2) {
        factorGravity = 0.02;  
        gravityStatus = "🟢 估值偏低 (具備潛力)";
    } else {
        factorGravity = 0;
        gravityStatus = "⚪ 估值合理 (安全區間)";
    }

    let moneyGrowth = (prevMoney && prevMoney > 0) ? ((money - prevMoney) / prevMoney) : 0;
    
    // ⚠️ 修正 1：改用「絕對差值」來算 CPI 變動，避免低基期造成的倍數爆炸
    // 例如 CPI 從 120 變 130，就是增加了 10%，也就是 0.1
    let cpiGrowth = (cpi - prevCpi) / 100; 
    
    // ⚠️ 修正 2：調降通膨的敏感度乘數 (從 10 降為 1)
    let cpiMultiplier = 1; 
    let sensitiveCpiGrowth = cpiGrowth * cpiMultiplier;

    // ⚠️ 修正 3：調降實質 GDP 對股價的殺傷力 (權重從 0.4 降為 0.15)
    // 即使實質經濟不好，股市通常會因為名目資金 (Money) 變多而硬撐
    let factorGDP = 0.15 * (realGdpGrowth / 100);
    let factorMoney = 0.3 * moneyGrowth;
    
    // ⚠️ 修正 4：微調通膨懲罰，控制在合理範圍
    let factorInflation = -0.05 * (inflation - 1) - 0.2 * sensitiveCpiGrowth; 
    let factorGini = 0.05 * (gini);

    let econFactor = factorGDP + factorMoney + factorInflation + factorGini + factorGravity;
    let baseChange = avgChange + econFactor + momentumFactor;
    
    if(baseChange > 0.1) baseChange = 0.1;
    if(baseChange < -0.1) baseChange = -0.1;

    // --- 4. 判斷情緒 ---
    const sentimentLevels = {
        "高度樂觀":0.03, "中度樂觀":0.02, "輕度樂觀":0.01,
        "中性":0,
        "輕度悲觀":-0.01, "中度悲觀":-0.02, "高度悲觀":-0.03
    };

    let score = baseChange;
    let sentiment = "";
    if(score>0.05) sentiment="高度樂觀";
    else if(score>0.03) sentiment="中度樂觀";
    else if(score>0) sentiment="輕度樂觀";
    else if(score>-0.03) sentiment="中性";
    else if(score>-0.05) sentiment="輕度悲觀";
    else if(score>-0.08) sentiment="中度悲觀";
    else sentiment="高度悲觀";

    let sentimentFactor = sentimentLevels[sentiment];

    // --- 5. 輸出結果與 10% 漲跌幅控制 ---
    let maxLimit = prevPrice * 1.10;
    let minLimit = prevPrice * 0.90;

    let table = `<tr>
        <th>情境</th><th>前一天股價</th><th>預測股價</th><th>預測變動%</th><th>漲跌限制</th><th>分析說明 (經濟面 + 籌碼面)</th>
    </tr>`;

    let scenarioNames = Object.keys(sentimentLevels);
    let chartData={};
    
    scenarioNames.forEach(name=>{
        chartData[name] = [...prices]; 
        
        let rawP = prevPrice * (1 + baseChange + sentimentLevels[name]);
        let finalP = rawP;
        let limitNote = "";

        if (finalP > maxLimit) { finalP = maxLimit; limitNote = "⚠️ 觸發漲停"; }
        if (finalP < minLimit) { finalP = minLimit; limitNote = "⚠️ 觸發跌停"; }

        finalP = Math.round(finalP*10)/10;
        chartData[name].push(finalP);

        let actualDiff = (((finalP/prevPrice)-1)*100).toFixed(1)+"%";
        let colorClass = finalP >= prevPrice ? "up" : "down";
        
        table += `<tr>
            <td>${name}</td>
            <td>${prevPrice}</td>
            <td class="${colorClass}">${finalP}</td>
            <td class="${colorClass}">${actualDiff}</td>
            <td class="limit">${limitNote}</td>
            <td style="text-align:left; font-size:13px;">
                <b>經濟:</b> (實質GDP成長:${realGdpGrowth}%, 通膨:${inflation})<br>
                <b>籌碼(近${calcDays}期):</b> 淨買入 ${netBuy} 張 (動能影響 ${(momentumFactor*100).toFixed(1)}%)
            </td>
        </tr>`;
    });

    let rawReal = prevPrice * (1 + baseChange + sentimentFactor);
    let realPrice = rawReal;
    let realNote = "";
    if (realPrice > maxLimit) { realPrice = maxLimit; realNote = "⚠️ 觸發漲停"; }
    if (realPrice < minLimit) { realPrice = minLimit; realNote = "⚠️ 觸發跌停"; }
    
    realPrice = Math.round(realPrice*10)/10;
    chartData["真實情況建議"] = [...prices, realPrice];
    
    let totalPercent = (((realPrice/prevPrice)-1)*100).toFixed(1);
    let realColorClass = totalPercent >= 0 ? "up" : "down";
    
    table += `<tr style="background:#e8f4f8;">
        <td colspan="2" style="font-size:18px;"><b>🎯 綜合預測結果 (${sentiment})</b></td>
        <td class="${realColorClass}" style="font-size:18px;"><b>${realPrice}</b></td>
        <td class="${realColorClass}" style="font-size:18px;"><b>${totalPercent}%</b></td>
        <td class="limit" style="font-size:14px;">${realNote}</td>
        <td style="text-align:left;">綜合經濟數據，結合近 ${calcDays} 期籌碼動能(淨買入 ${netBuy} 張)之結果，並套用±10%限制。</td>
    </tr>`;

    let chartDates = [...dates, "下一期預測"];
    document.getElementById("resultTable").innerHTML = table;

    // --- 6. 繪圖 ---
    if(chart) chart.destroy();
    chart = new Chart(document.getElementById("priceChart"),{
        type:'line',
        data:{
            labels: chartDates,
            datasets:[
                {label:"高度樂觀", data:chartData["高度樂觀"], borderColor:'rgba(139,0,0,0.3)', fill:false},
                {label:"中度樂觀", data:chartData["中度樂觀"], borderColor:'rgba(255,0,0,0.3)', fill:false},
                {label:"輕度樂觀", data:chartData["輕度樂觀"], borderColor:'rgba(255,165,0,0.3)', fill:false},
                {label:"中性", data:chartData["中性"], borderColor:'rgba(128,128,128,0.3)', fill:false},
                {label:"輕度悲觀", data:chartData["輕度悲觀"], borderColor:'rgba(144,238,144,0.3)', fill:false},
                {label:"中度悲觀", data:chartData["中度悲觀"], borderColor:'rgba(0,128,0,0.3)', fill:false},
                {label:"高度悲觀", data:chartData["高度悲觀"], borderColor:'rgba(0,100,0,0.3)', fill:false},
                {label:`🎯 真實情況預測 (${sentiment})`, data:chartData["真實情況建議"], borderColor:'blue', fill:false, borderWidth:4, pointRadius: 5}
            ]
        },
        options:{
            responsive:true,
            plugins:{
                title: { display: true, text: `市場當前情緒預測：${sentiment} (已套用±10%限制)`, font: {size: 18} },
                legend:{position:'top'},
                zoom:{
                    pan:{ enabled:true, mode:'x', modifierKey:'ctrl' },
                    zoom:{ wheel:{enabled:true}, pinch:{enabled:true}, mode:'x' }
                }
            },
            scales:{
                y:{beginAtZero:false,title:{display:true,text:'股價'}},
                x:{title:{display:true,text:'日期'}}
            }
        }
    });

// ==========================================
    // 📝 自動生成「經濟學家分析報告」 (清晰明確版)
    // ==========================================
    
    const toPercent = (num) => {
        let p = (num * 100).toFixed(2);
        return p > 0 ? `+${p}%` : `${p}%`;
    };

    // 依據數值正負，決定顯示文字與顏色 (台灣股市：紅漲綠跌)
    const getForceText = (val) => val >= 0 ? `<b style="color: red;">${toPercent(val)} 的上漲動能</b>` : `<b style="color: green;">${toPercent(val)} 的下跌壓力</b>`;
    
    // 動態判斷各項指標的敘述
    let gdpDesc = realGdpGrowth >= 0 ? "企業與學生實質創造了獲利，經濟正在擴張" : "受到物價或產出減少影響，實質經濟陷入衰退";
    let moneyDesc = moneyGrowth >= 0 ? "流通資金變多了，熱錢容易湧入股市" : "流通資金減少了，資金正在撤出股市";
    let inflationDesc = factorInflation >= 0 ? "目前的物價波動在可控範圍，未對股市造成傷害" : "物價飆漲引發了通膨恐慌，嚴重吃掉民眾購買力，壓抑了股市表現";
    let giniDesc = factorGini >= 0 ? "財富較為集中，大戶容易將閒置資金投入股市炒作" : "財富分配相對平均，市場缺乏大戶炒作資金";
    let gravityDesc = factorGravity >= 0 ? "目前股價很便宜，具備向上反彈的推力" : "目前股價已偏貴，面臨向下修正的拉力";
    let momentumDesc = netBuy >= 0 ? "市場情緒樂觀，出現追捧買盤" : "市場情緒悲觀，出現拋售賣壓";

    let reportHTML = `
        <p>根據最新一期的經濟數據，本次股價的漲跌動能主要由以下幾個基本面組成：</p>
        <ul style="list-style-type: none; padding-left: 0;">
            <li style="margin-bottom: 12px;">
                <b>📈 實質經濟動能 (權重 15%)：</b><br>
                班級目前的實質 GDP 成長率為 <b>${realGdpGrowth}%</b>。這代表${gdpDesc}，為股價基本面帶來了 ${getForceText(factorGDP)}。
            </li>
            <li style="margin-bottom: 12px;">
                <b>💸 資金熱錢效應 (權重 30%)：</b><br>
                相比上一期，市場貨幣供給量變動了 <b>${toPercent(moneyGrowth)}</b>。這意味著${moneyDesc}，為股價貢獻了 ${getForceText(factorMoney)}。
            </li>
            <li style="margin-bottom: 12px;">
                <b>📉 物價與通膨壓力 (權重 30%)：</b><br>
                班級目前的通膨指數為 <b>${inflation}</b>，CPI 相比前期變動了 <b>${(cpiGrowth * 100).toFixed(1)}%</b>。<br>
                系統判定：${inflationDesc}，這產生了 ${getForceText(factorInflation)}。
            </li>
            <li style="margin-bottom: 12px;">
                <b>⚖️ 貧富差距效應 (權重 5%)：</b><br>
                當前吉尼係數為 <b>${gini}</b>。因為${giniDesc}，微幅帶來了 ${getForceText(factorGini)}。
            </li>
            <li style="margin-bottom: 12px; padding-top: 12px; border-top: 1px dashed #ccc;">
                <b>🍎 估值地心引力 (巴菲特指標)：</b><br>
                班級股市總市值為 <b>${Math.round(marketCap)}</b> 點，對比名目 GDP(${latestNominalGdp})，估值倍數為 <b>${valuationRatio.toFixed(2)} 倍</b>。<br>
                系統判定目前狀態為「<b>${gravityStatus}</b>」，代表${gravityDesc}，這為股價帶來了 ${getForceText(factorGravity)}！
            </li>
            <li style="margin-bottom: 12px; padding-top: 12px; border-top: 1px dashed #ccc;">
                <b>🛍️ 投資人情緒與籌碼動能：</b><br>
                近 ${calcDays} 期內，全班淨買賣超為 <b>${netBuy} 張</b>。${momentumDesc}，這股情緒直接為股價附加了 ${getForceText(momentumFactor)}！
            </li>
        </ul>
        <div style="background: #fdfefe; padding: 15px; border-radius: 8px; border: 1px solid #d0d3d4; margin-top: 15px;">
            <p style="font-weight: bold; color: #d35400; margin: 0; font-size: 16px;">
                💡 總結分析：
            </p>
            <p style="margin: 5px 0 0 0; color: #34495e;">
                總體經濟分數 (<b>${toPercent(econFactor)}</b>) ＋ 籌碼動能 (<b>${toPercent(momentumFactor)}</b>) ＋ 歷史慣性 (<b>${toPercent(avgChange)}</b>) = 決定了最終的股價走勢！
            </p>
        </div>
    `;

    let reportDiv = document.getElementById("analysisReport");
    let contentDiv = document.getElementById("reportContent");
    if(reportDiv && contentDiv) {
        contentDiv.innerHTML = reportHTML;
        reportDiv.style.display = "block"; 
    }
}
</script>

</body>
</html>
